<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="18%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#1c2540"/>
      <stop offset="55%" stop-color="#0e1220"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="hexfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid dots for texture -->
  <g opacity="0.12">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- decorative hex rings, echoing favicon -->
  <g transform="translate(940,150)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#3b4bff" stroke-width="1.5" opacity="0.25"/>
    <polygon points="0,-95 82,-47 82,47 0,95 -82,47 -82,-47" fill="none" stroke="#6b7280" stroke-width="1" opacity="0.18"/>
  </g>
  <g transform="translate(1060,420) scale(0.6)">
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="#3b4bff" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(120,150)">
    <polygon points="55,0 105,29 105,87 55,116 5,87 5,29" fill="url(#hexfill)"/>
    <text x="55" y="68" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="26" font-weight="700" fill="#ffffff">n3os</text>
  </g>

  <text x="120" y="330" font-family="DejaVu Sans Mono, monospace" font-size="30" font-weight="700" letter-spacing="2" fill="#60a5fa">N3O STUDIOS</text>

  <text x="118" y="410" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">The platform for tools</text>
  <text x="118" y="480" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">that actually work.</text>

  <text x="120" y="540" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#94a3b8">Curated, searchable, and completely free — no fluff, no affiliate links.</text>

  <rect x="120" y="575" width="46" height="6" rx="3" fill="#2563eb"/>
</svg>
